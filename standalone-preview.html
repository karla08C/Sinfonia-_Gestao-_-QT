    // ETAPAS DO KANBAN SINFONIA (7 ETAPAS CLÍNICAS)

    const NEXT_LABELS = {
      'Aguardando Check-in': { label: 'Encaminhar Consulta', color: 'bg-blue-600 hover:bg-blue-700 text-white' },

    function App() {
      const [pacientes, setPacientes] = useState(SEED_PACIENTES);
      const [poltronas, setPoltronas] = useState(SEED_POLTRONAS);
      const [capelas, setCapelas] = useState(SEED_CAPELAS);
      const [protocolos, setProtocolos] = useState(SEED_PROTOCOLOS);

      // Regras de Agendamento
      const [regras, setRegras] = useState({
        tempo_higienizacao_min: 15,
        tempo_transporte_bolsa_min: 15,
        tempo_acomodacao_min: 10,
        inicio_turno_manha: '07:00',
        inicio_turno_tarde: '12:30'
      });

      // Filtros da Torre de Controle
      const [busca, setBusca] = useState('');
      const [filtroMedico, setFiltroMedico] = useState('');
      const [filtroTurno, setFiltroTurno] = useState('');
      const [filtroProtocolo, setFiltroProtocolo] = useState('');

      const [activeTab, setActiveTab] = useState('kanban'); // 'kanban' | 'capela' | 'poltronas' | 'hoje_proposta' | 'gantt'
      const [isSextaFeira, setIsSextaFeira] = useState(false);
      const [isSchedulerOpen, setIsSchedulerOpen] = useState(false);
      const [isNewPatientOpen, setIsNewPatientOpen] = useState(false);
      const [isImprevistoOpen, setIsImprevistoOpen] = useState(false);
      const [isRulesOpen, setIsRulesOpen] = useState(false);
      const [toast, setToast] = useState(null);
      const [currentTime, setCurrentTime] = useState('');

      useEffect(() => {
        const tick = () => {
          setCurrentTime(new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        };
        tick();
        const t = setInterval(tick, 1000);
        return () => clearInterval(t);
      }, []);

      const showToast = (mensagem) => {
        setToast(mensagem);
        setTimeout(() => setToast(null), 3500);
      };

      // KPIs Computados
      const kpis = useMemo(() => {
        const totalPolts = poltronas.length || 1;
        const ocupadas = poltronas.filter(p => p.status === 'Ocupada').length;
        const taxaOcupacao = Math.round((ocupadas / totalPolts) * 100);

        let totalMins = 0;
        pacientes.forEach(p => {
          const dur = p.duracao_infusao_min || 120;
          if (p.status === 'Alta') totalMins += dur;
          else if (p.status === 'Em Infusão') {
            const rest = p.minutos_restantes_infusao ?? 60;
            totalMins += Math.max(0, dur - rest);
          }
        });

        const horas = Math.floor(totalMins / 60);
        const mins = totalMins % 60;

        return {
          totalHorasQt: `${horas}h ${String(mins).padStart(2, '0')}m`,
          portaAgulha: 38,
          taxaOcupacao,
          ocupadas,
          totalPolts,
          capelaStatus: capelas[0]?.status || 'Disponível',
          alertasHigienizacao: pacientes.filter(p => p.status === 'Em Infusão' && (p.minutos_restantes_infusao ?? 99) <= 15).length
        };
      }, [pacientes, poltronas, capelas]);

      // Filtro dinâmico de pacientes
      const pacientesFiltrados = useMemo(() => {
        return pacientes.filter(p => {
          if (busca) {
            const termo = busca.toLowerCase();
            const nomeMatch = p.nome && p.nome.toLowerCase().includes(termo);
            const prontMatch = p.prontuario && p.prontuario.toLowerCase().includes(termo);
            if (!nomeMatch && !prontMatch) return false;
          }
          if (filtroMedico && p.medico !== filtroMedico) return false;
          if (filtroTurno && p.turno !== filtroTurno) return false;
          if (filtroProtocolo && p.protocolo_nome !== filtroProtocolo) return false;
          return true;
        });
      }, [pacientes, busca, filtroMedico, filtroTurno, filtroProtocolo]);

      // AVANÇAR ETAPA KANBAN COM 1 CLIQUE (7 ETAPAS)
      const avancarEtapa = (pacienteId) => {
        const stages = KANBAN_STAGES.map(s => s.id);
        const pac = pacientes.find(p => p.id === pacienteId);
        if (!pac) return;

        const currIdx = stages.indexOf(pac.status);
        if (currIdx < stages.length - 1) {
          const nextStatus = stages[currIdx + 1];

          let updatedPoltId = pac.poltrona_id;
          let updatedPoltNum = pac.poltrona_numero;

          if (nextStatus === 'Em Infusão') {
            if (!updatedPoltId) {
              const poltLivre = poltronas.find(p => p.status === 'Livre');
              if (poltLivre) {
                updatedPoltId = poltLivre.id;
                updatedPoltNum = poltLivre.numero;
              }
            }
          }

          setPoltronas(prev => prev.map(p => {
            if (nextStatus === 'Em Infusão' && p.id === updatedPoltId) {
              return {
                ...p,
                status: 'Ocupada',
                paciente_atual_id: pac.id,
                paciente_nome: pac.nome,
                paciente_prontuario: pac.prontuario,
                protocolo_nome: pac.protocolo_nome,
                duracao_infusao_min: pac.duracao_infusao_min,
                minutos_restantes_infusao: pac.minutos_restantes_infusao,
                progresso_pct: 10,
                alerta_higienizacao: (pac.minutos_restantes_infusao ?? 99) <= 15
              };
            }
            if (nextStatus === 'Alta' && p.id === pac.poltrona_id) {
              return {
                ...p,
                status: 'Higienização',
                paciente_atual_id: null,
                paciente_nome: null,
                progresso_pct: 0,
                alerta_higienizacao: false
              };
            }
            return p;
          }));

          setPacientes(prev => prev.map(p => {
            if (p.id === pacienteId) {
              return {
                ...p,
                status: nextStatus,
                poltrona_id: updatedPoltId,
                poltrona_numero: updatedPoltNum,
                horario_inicio_infusao_real: nextStatus === 'Em Infusão' ? new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : p.horario_inicio_infusao_real,
                minutos_restantes_infusao: nextStatus === 'Alta' ? 0 : p.minutos_restantes_infusao,
                alerta_higienizacao: nextStatus === 'Em Infusão' && (p.minutos_restantes_infusao ?? 99) <= 15
              };
            }
            return p;
          }));

          showToast(`Paciente ${pac.nome} avançou para "${nextStatus}"!`);
        }
      };

      // LIBERAR POLTRONA HIGIENIZADA
      const liberarPoltrona = (poltId) => {
        setPoltronas(prev => prev.map(p => {
          if (p.id === poltId) {
            return {
              ...p,
              status: 'Livre',
              paciente_atual_id: null,
              paciente_nome: null,
              paciente_prontuario: null,
              protocolo_nome: null,
              duracao_infusao_min: null,
              minutos_restantes_infusao: null,
              progresso_pct: 0,
              alerta_higienizacao: false
            };
          }
          return p;
        }));
        showToast('Poltrona higienizada e liberada para o próximo paciente!');
      };

      // FARMÁCIA: INICIAR PREPARO CAPELA
      const iniciarPreparoCapela = (pacienteId) => {
        const item = pacientes.find(p => p.id === pacienteId) || pacientes.find(p => p.status === 'Triagem/Punção');
        if (!item) return;

        setCapelas(prev => prev.map(c => ({
          ...c,
          status: 'Manipulando',

                    </div>
                  </div>

                  <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3">
                    <span className="font-bold text-slate-900 block">Protocolos Ativos na Unidade:</span>
                    <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
                      <table className="w-full text-left text-xs">
                        <thead>
                          <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase text-[10px] font-bold">
                            <th className="p-2.5">Protocolo</th>
                            <th className="p-2.5">Preparo</th>
                            <th className="p-2.5">Infusão</th>
                            <th className="p-2.5">Limite Cut-off</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {protocolos.map(p => (
                            <tr key={p.id}>
                              <td className="p-2.5 font-bold text-slate-900">{p.nome}</td>
                              <td className="p-2.5 font-mono">{p.duracao_manipulacao_min}m</td>
                              <td className="p-2.5 font-mono">{p.duracao_infusao_min}m</td>
                              <td className="p-2.5 font-mono font-bold text-amber-800">{p.horarioLimite}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>

                <div className="p-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-2">
                  <button onClick={() => setIsRulesOpen(false)} className="px-4 py-2 rounded-xl text-slate-600 font-semibold hover:bg-slate-200">Fechar</button>
                  <button onClick={() => { setIsRulesOpen(false); showToast('Regras de agendamento salvas!'); }} className="px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold shadow-xs">Salvar Parâmetros</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: REGISTRAR IMPREVISTO */}
          {isImprevistoOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-5 shadow-2xl">
                <div className="flex justify-between items-center mb-3">
                  <div>
                    <h3 className="font-bold text-slate-900 text-base">Registrar Imprevisto Clínico</h3>
                    <p className="text-xs text-slate-500">Recálculo automático do efeito cascata (Planejado × Realizado)</p>
                  </div>
                  <button onClick={() => setIsImprevistoOpen(false)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  showToast(`Imprevisto registrado! Efeito cascata recalculado.`);
                  setIsImprevistoOpen(false);
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-600 font-bold block mb-1">Paciente</label>
                    <select className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-slate-900 font-semibold">
                      {pacientes.map(p => (
                        <option key={p.id} value={p.id}>{p.nome} ({p.prontuario}) - {p.protocolo_nome}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="text-slate-600 font-bold block mb-1">Tipo de Imprevisto</label>
                    <select className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-slate-900">
                      <option>Atraso na chegada do paciente (+ minutos)</option>
                      <option>Falta / Não comparecimento (Liberar vaga)</option>
                      <option>Atraso na bolsa pela capela</option>
                      <option>Término real estendido (reação adversa / vazão lenta)</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-slate-600 font-bold block mb-1">Tempo de Desvio (minutos)</label>
                    <input type="number" defaultValue={20} className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-slate-900 font-mono" />
                  </div>

                  <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-[11px] text-amber-900">
                    ℹ️ O Sinfonia mantém o paciente na mesma poltrona e ajusta os horários posteriores sem quebrar a esterilidade da capela.
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-200">
                    <button type="button" onClick={() => setIsImprevistoOpen(false)} className="px-3 py-1.5 rounded-lg text-slate-600 font-medium">Cancelar</button>
                    <button type="submit" className="px-4 py-1.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-bold">Aplicar Recálculo</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: MOTOR DE AGENDAMENTO TETRIS CLÍNICO */}
          {isSchedulerOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="bg-white border border-slate-200 rounded-3xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
                <div className="p-5 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                  <div>
                    <h3 className="text-lg font-bold text-slate-900">Motor de Agendamento Sinfonia (Tetris Clínico + Cut-Off)</h3>
                    <p className="text-xs text-slate-500">Regras: Tetris Clínico • Just-in-Time Capela • Giro de Leito 15 min • Horários Limite</p>
                  </div>
                  <button onClick={() => setIsSchedulerOpen(false)} className="text-slate-400 hover:text-slate-700 p-1 font-bold">✕</button>
                </div>

                <div className="p-6 overflow-y-auto space-y-5 flex-1 text-xs">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div className="p-3 rounded-xl bg-teal-50 border border-teal-200">
                      <strong className="text-teal-900 block mb-1">1. Regra Tetris Clínico</strong>
                      <span className="text-teal-800">• &gt;240m: Manhã (07h30-08h30)<br />• 120-240m: Meio-dia (10h00)<br />• &lt;120m: Tarde (13h00)</span>
                    </div>
                    <div className="p-3 rounded-xl bg-amber-50 border border-amber-200">
                      <strong className="text-amber-900 block mb-1">2. Sincronia Just-in-Time</strong>
                      <span className="text-amber-800">Início Capela = Infusão - Manipulação - 15m (transporte). Sem ociosidade.</span>
                    </div>
                    <div className="p-3 rounded-xl bg-sky-50 border border-sky-200">
                      <strong className="text-sky-900 block mb-1">3. Giro de Leito Seguro</strong>
                      <span className="text-sky-800">Bloqueio estrito de 15 minutos para higienização entre pacientes.</span>
                    </div>
                  </div>

                  <div className="border border-slate-200 rounded-xl overflow-hidden shadow-xs">
                    <table className="w-full text-left font-mono text-xs">
                      <thead className="bg-slate-50 text-slate-600 uppercase text-[10px] font-bold border-b border-slate-200">
                        <tr>
                          <th className="py-2.5 px-3">Paciente</th>
                          <th className="py-2.5 px-3">Protocolo</th>
                          <th className="py-2.5 px-3">Poltrona</th>
                          <th className="py-2.5 px-3">Chegada</th>
                          <th className="py-2.5 px-3 text-amber-800">Capela (JIT)</th>
                          <th className="py-2.5 px-3 text-teal-800">Infusão</th>
                          <th className="py-2.5 px-3 text-slate-600">Higienização</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 bg-white font-sans">
                        {pacientes.map((p, idx) => (
                          <tr key={idx} className="hover:bg-slate-50">
                            <td className="py-2.5 px-3 font-bold text-slate-900">{p.nome}</td>
                            <td className="py-2.5 px-3 text-teal-800 font-mono text-[11px] font-semibold">{p.protocolo_nome} ({p.duracao_infusao_min}m)</td>
                            <td className="py-2.5 px-3 font-semibold text-slate-700">{p.poltrona_numero || `Poltrona 0${(idx%4)+1}`}</td>
                            <td className="py-2.5 px-3 font-mono text-slate-700">{p.horario_chegada || '08:00'}</td>
                            <td className="py-2.5 px-3 font-mono text-amber-800 font-bold">07:45 - 08:15</td>
                            <td className="py-2.5 px-3 font-mono text-teal-800 font-bold">08:30 - 11:30</td>
                            <td className="py-2.5 px-3 font-mono text-slate-500">11:30 - 11:45</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div className="p-4 border-t border-slate-200 flex justify-end gap-3 bg-slate-50">
                  <button onClick={() => setIsSchedulerOpen(false)} className="px-4 py-2 rounded-xl text-slate-600 hover:text-slate-900 font-semibold">Fechar</button>
                  <button onClick={() => { setIsSchedulerOpen(false); showToast('Grade Sinfonia aplicada com sucesso!'); }} className="px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold shadow-md shadow-teal-600/20">Confirmar e Aplicar Grade</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: NOVO PACIENTE */}
          {isNewPatientOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-xs">
              <div className="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-5 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-slate-900 text-base">Admissão de Paciente (Recepção Sinfonia)</h3>
                  <button onClick={() => setIsNewPatientOpen(false)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const nome = form.nome.value;
                  const prontuario = form.prontuario.value;
                  const protId = Number(form.protocolo.value);
                  const prot = protocolos.find(p => p.id === protId) || protocolos[0];

                  const novo = {
                    id: Date.now(),
                    nome,
                    prontuario,
                    status: 'Aguardando Check-in',
                    protocolo_id: prot.id,
                    protocolo_nome: prot.nome,
                    tipo_droga: prot.tipo_droga,
                    corFolha: prot.corFolha,
                    horarioLimite: prot.horarioLimite,
                    duracao_manipulacao_min: prot.duracao_manipulacao_min,
                    duracao_infusao_min: prot.duracao_infusao_min,
                    poltrona_id: null,
                    poltrona_numero: null,
                    horario_chegada: form.chegada.value || '10:30',
                    horario_inicio_infusao_real: null,
                    minutos_restantes_infusao: prot.duracao_infusao_min,
                    alerta_higienizacao: false,
                    medico: form.medico.value || 'Dra. Camila Torres',
                    turno: form.turno.value || 'Manhã',
                    ciclo: 'Ciclo 1/6',
                    acesso_venoso: 'Port-a-Cath',
                    exames_status: 'Exames Liberados'
                  };

                  setPacientes(prev => [...prev, novo]);
                  setIsNewPatientOpen(false);
                  showToast(`Paciente ${nome} admitido na recepção!`);
                }} className="space-y-3.5 text-xs">
                  <div>
                    <label className="text-slate-600 font-semibold block mb-1">Nome Completo</label>
                    <input name="nome" required placeholder="Ex: Patrícia Helena Silveira" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-slate-900 focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-600 font-semibold block mb-1">Prontuário</label>
                      <input name="prontuario" defaultValue={`PAC-0${Math.floor(10 + Math.random() * 89)}`} className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-slate-900 font-mono focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600" />
                    </div>
                    <div>
                      <label className="text-slate-600 font-semibold block mb-1">Horário Chegada</label>
                      <input name="chegada" type="time" defaultValue="10:30" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-slate-900 font-mono focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-600 font-semibold block mb-1">Médico Responsável</label>
                      <select name="medico" className="w-full bg-white border border-slate-300 rounded-xl px-2 py-2 text-slate-900">
                        <option value="Dra. Camila Torres">Dra. Camila Torres</option>
                        <option value="Dr. Roberto Alencar">Dr. Roberto Alencar</option>
                        <option value="Dra. Mariana Rios">Dra. Mariana Rios</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-slate-600 font-semibold block mb-1">Turno</label>
                      <select name="turno" className="w-full bg-white border border-slate-300 rounded-xl px-2 py-2 text-slate-900">
                        <option value="Manhã">☀️ Manhã</option>
                        <option value="Tarde">🌙 Tarde</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="text-slate-600 font-semibold block mb-1">Protocolo Quimioterápico</label>
                    <select name="protocolo" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-slate-900 focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600">
                      {protocolos.map(p => (
                        <option key={p.id} value={p.id}>{p.nome} ({p.duracao_infusao_min}m QT • Limite: {p.horarioLimite})</option>
                      ))}
                    </select>
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-200">
                    <button type="button" onClick={() => setIsNewPatientOpen(false)} className="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 font-medium">Cancelar</button>
                    <button type="submit" className="px-4 py-1.5 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-bold shadow-xs">Cadastrar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-500 font-medium">
            Sinfonia • Orquestração e Sincronização da Quimioterapia • Tetris Clínico + Just-in-Time Capela + Giro Seguro de Leito
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
